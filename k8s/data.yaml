apiVersion: v1
kind: ConfigMap
metadata: {name: postgres-init, namespace: barq}
data:
  01-init.sql: |
    CREATE TABLE IF NOT EXISTS records (
        id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        title varchar(200) NOT NULL CHECK (length(trim(title)) > 0)
    );
    INSERT INTO records (title) VALUES
        ('Review service readiness'),
        ('Document the operating procedure');
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: barq}
spec:
  clusterIP: None
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: barq}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
        - {name: POSTGRES_USER, value: barq_app}
        - {name: POSTGRES_DB, value: barq_tasks}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: barq-secret, key: POSTGRES_PASSWORD}}
        ports: [{containerPort: 5432}]
        readinessProbe:
          exec: {command: ["pg_isready","-U","barq_app","-d","barq_tasks"]}
          periodSeconds: 3
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 750m, memory: 512Mi}
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql/data}
        - {name: init, mountPath: /docker-entrypoint-initdb.d}
      volumes:
      - name: init
        configMap: {name: postgres-init}
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: redis-data, namespace: barq}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 500Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: barq}
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: barq}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
      - name: redis
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        command: ["redis-server","--appendonly","yes"]
        ports: [{containerPort: 6379}]
        readinessProbe:
          exec: {command: ["redis-cli","ping"]}
          periodSeconds: 3
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {cpu: 250m, memory: 128Mi}
        volumeMounts: [{name: data, mountPath: /data}]
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: redis-data}
