apiVersion: v1
kind: ConfigMap
metadata: {name: nginx-conf, namespace: barq}
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr warn;
    pid /var/run/nginx.pid;
    events { worker_connections 1024; }
    http {
        include /etc/nginx/mime.types;
        log_format assessment escape=json '{"timestamp":"$time_iso8601","service":"edge","request_id":"$request_id","method":"$request_method","path":"$uri","status":$status,"upstream":"$upstream_addr","upstream_status":"$upstream_status","request_time":"$request_time"}';
        access_log /dev/stdout assessment;
        upstream application_pool {
            server app:8080 max_fails=1 fail_timeout=5s;
        }
        server {
            listen 80;
            server_name _;
            location / {
                proxy_pass http://application_pool;
                proxy_set_header Host $host;
                proxy_set_header X-Request-ID $request_id;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_connect_timeout 2s;
                proxy_read_timeout 3s;
                proxy_next_upstream error timeout http_502 http_503 http_504;
                proxy_next_upstream_tries 2;
            }
        }
    }
---

apiVersion: apps/v1
kind: Deployment
metadata: {name: nginx, namespace: barq}
spec:
  replicas: 1
  selector: {matchLabels: {app: nginx}}
  template:
    metadata: {labels: {app: nginx}}
    spec:
      containers:
      - name: nginx
        image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
        ports: [{containerPort: 80}]
        readinessProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 5
        resources:
          requests: {cpu: 25m, memory: 16Mi}
          limits: {cpu: 250m, memory: 64Mi}
        volumeMounts:
        - {name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf}
      volumes:
      - name: conf
        configMap: {name: nginx-conf}

---

apiVersion: v1
kind: Service
metadata: {name: nginx, namespace: barq}
spec:
  type: NodePort
  selector: {app: nginx}
  ports: [{port: 80, targetPort: 80, nodePort: 30090}]

