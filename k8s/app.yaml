apiVersion: v1
kind: Service
metadata: {name: app, namespace: barq}
spec:
  selector: {app: app}
  ports: [{port: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: app, namespace: barq}
spec:
  replicas: 3
  selector: {matchLabels: {app: app}}
  template:
    metadata: {labels: {app: app}}
    spec:
      containers:
      - name: app
        image: mohamedhamdy120/barq-app:v1
        ports: [{containerPort: 8080}]
        env:
        - {name: APP_HOST, value: "0.0.0.0"}
        - {name: APP_PORT, value: "8080"}
        - {name: APP_MESSAGE, value: "Welcome to BARQ Systems"}
        - {name: REDIS_URL, value: "redis://redis:6379/0"}
        - name: INSTANCE_ID
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        - name: DATABASE_URL
          valueFrom: {secretKeyRef: {name: barq-secret, key: DATABASE_URL}}
        readinessProbe:
          httpGet: {path: /health, port: 8080}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /health, port: 8080}
          periodSeconds: 10
        securityContext: {runAsNonRoot: true, runAsUser: 10001}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
